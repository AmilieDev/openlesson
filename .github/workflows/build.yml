
name: OpenLesson BASE Builds

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

jobs:
    build:
        name: ${{ matrix.name }}
        runs-on: ${{ matrix.os }}

    strategy:
        fail-fast: false
        matrix:
            include:
            - name: Windows-x64
                os: windows-2022

            - name: Linux-x64
                os: ubuntu-22.04

            - name: macOS
                os: macos-26

        steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Install Qt6
          uses: jurplel/install-qt-action@v4
        with:
            version: '6.8.3'
            cache: true

      - name: Configure
        shell: bash
        run: |
            cmake -S . -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/portable"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Deploy portable application
        run: cmake --install build --config Release

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
            name: OpenLesson-${{ matrix.name }}
            path: portable/
            if-no-files-found: error
